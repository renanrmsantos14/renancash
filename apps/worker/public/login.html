<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Banco">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Entrar · Meu Banco</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --texto: #16181d; --suave: #626a77; --borda: #e3e6eb;
    --vermelho: #c62f2f; --laranja: #ff7a00; --azul: #2563eb; --erro-bg: #fdecec; --erro-borda: #e58a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --texto: #eceef2; --suave: #9aa3b2; --borda: #2a2f38;
      --vermelho: #ff6b6b; --laranja: #ff9a3c; --azul: #6aa0ff; --erro-bg: #2d1515; --erro-borda: #8a2f2f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 24px 20px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  p { margin: 0; color: var(--suave); font-size: 13px; }
  label { font-size: 13px; font-weight: 600; color: var(--suave); }
  input, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 8px 12px; min-height: 44px; width: 100%; }
  input { font-size: 16px; } /* 16px evita o zoom automático do iPhone */
  button { background: var(--laranja); border-color: var(--laranja); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  #erro { border: 1px solid var(--erro-borda); background: var(--erro-bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  #versao { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: var(--suave); opacity: .7; pointer-events: none; user-select: none; }
</style>
</head>
<body>
<form id="form" method="post" action="/api/login">
  <h1>Meu Banco</h1>
  <p>Digite a senha para entrar.</p>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
  <div id="erro" role="alert" hidden></div>
  <button id="entrar" type="submit">Entrar</button>
</form>
<span id="versao">v0.0.69 · 18/11/2026 11:03</span>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const botao = $("entrar");
  botao.disabled = true; botao.textContent = "Entrando…"; $("erro").hidden = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ senha: $("senha").value }) });
    if (r.ok) { const volta = new URLSearchParams(location.search).get("volta"); location.replace(volta === "/app/" ? "/app/" : "/"); return; }
    const j = await r.json().catch(() => ({}));
    $("erro").textContent = r.status === 401 ? "Senha incorreta." : j.erro || "Erro " + r.status;
  } catch { $("erro").textContent = "Sem conexão. Tente de novo."; }
  $("erro").hidden = false; $("senha").select();
  botao.disabled = false; botao.textContent = "Entrar";
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
