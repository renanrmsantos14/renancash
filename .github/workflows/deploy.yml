name: Deploy Worker

# Publica o Worker com o app web (budget/) em /app/.
# Dispara em push na main que mexe no servidor, depois de cada release do app (release-android.yml chama
# este workflow, já com a versão nova do pubspec) ou manualmente.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    # O commit de versão feito por este workflow não dispara outro deploy (na chamada pela release não há head_commit).
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build web do app (budget/)
        run: scripts/compilar.sh web "$GITHUB_WORKSPACE/apps/worker/public/app"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm -r typecheck

      - name: Migração do D1 (idempotente)
        run: pnpm --filter @meu-banco/worker migrar -- --remote

      # O Worker foi renomeado de meu-banco para renancash no painel (os secrets vão junto).
      # Sem o rename, o deploy criaria um "renancash" vazio e o redirecionamento tomaria o lugar do antigo.
      - name: Conferir o Worker renancash com secrets
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/renancash/secrets"
          if ! curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | grep -Eq '"name": ?"APP_PASSWORD"'; then
            echo "::error::Renomeie o Worker meu-banco para renancash no painel da Cloudflare antes do deploy."
            exit 1
          fi

      - name: Publicar
        run: pnpm push

      - name: Redirecionar o endereço antigo
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --config ../redirect-antigo/wrangler.toml

      - name: Gravar a versão publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          versao=$(node -p "require('./apps/worker/package.json').version")
          git add apps/worker/package.json apps/worker/public/index.html apps/worker/public/login.html apps/worker/public/sw.js
          git commit -m "Versão v${versao} publicada pelo GitHub Actions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
