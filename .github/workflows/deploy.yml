name: Deploy Worker

# Publica o Worker com o app web do Meu Cashew em /app/.
# Dispara em push no main deste repo, por aviso do meu-cashew (push no main dele) ou manualmente.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cashew-main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    # O commit de versão feito por este workflow não dispara outro deploy.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: renanrmsantos14/meu-cashew
          ref: main
          path: cashew
          persist-credentials: false

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build web do Meu Cashew
        working-directory: cashew
        run: scripts/compilar.sh web "$GITHUB_WORKSPACE/apps/worker/public/app"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm -r typecheck

      - name: Migração do D1 (idempotente)
        run: pnpm --filter @meu-banco/worker migrar:fase2 -- --remote

      - name: Publicar
        run: pnpm push

      - name: Gravar a versão publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          versao=$(node -p "require('./apps/worker/package.json').version")
          git add apps/worker/package.json apps/worker/public/index.html apps/worker/public/login.html apps/worker/public/sw.js
          git commit -m "Versão v${versao} publicada pelo GitHub Actions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
