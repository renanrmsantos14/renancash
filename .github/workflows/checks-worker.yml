name: Checks do Worker

# Valida PRs que mexem no servidor (apps/, packages/): testes do Worker e do core e typecheck.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/checks-worker.yml'
  workflow_dispatch:

concurrency:
  group: checks-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Os scripts do deploy (scripts/*.mjs) não são importados pelos testes: confere ao menos a sintaxe.
      - name: Sintaxe dos scripts
        run: for f in apps/worker/src/*.js apps/worker/scripts/*.mjs apps/worker/mock/*.mjs; do node --check "$f"; done
      - run: pnpm test
      - run: pnpm -r typecheck
