name: Backup D1

# Exporta o D1 de produção (meu-banco) e guarda como artefato criptografado.
# O repo é público: o dump só sai daqui cifrado com BACKUP_PASSPHRASE (AES256, gpg simétrico).
# Para abrir: gpg --batch --passphrase-file <senha> -d d1.sql.gpg > d1.sql
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Exportar e cifrar
        working-directory: apps/worker
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Secret BACKUP_PASSPHRASE ausente"; exit 1; }
          pnpm exec wrangler d1 export meu-banco --remote --output="$RUNNER_TEMP/d1.sql"
          echo "Linhas INSERT: $(grep -c '^INSERT' "$RUNNER_TEMP/d1.sql")"
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/senha"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/senha" \
            --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/d1.sql.gpg" "$RUNNER_TEMP/d1.sql"
          rm -f "$RUNNER_TEMP/senha" "$RUNNER_TEMP/d1.sql"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d1-backup
          path: ${{ runner.temp }}/d1.sql.gpg
          retention-days: 7
          if-no-files-found: error
